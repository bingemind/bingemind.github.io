    - region [ref=e161]:
      - article [ref=e162]:
        - heading "How a cake pan converter works" [level=2] [ref=e163]
        - paragraph [ref=e164]: "A cake pan converter tells you how much batter a new pan needs compared with the pan in your recipe. You enter both pans and read one number: the scale factor. Multiply every ingredient by that number and the cake fills the new pan to the same depth. Pan size is the most common reason a good recipe fails, so this one number saves a lot of waste."
        - paragraph [ref=e165]: The math is simple. Find how much batter each pan bakes (the area times the depth, times the share of the pan you fill), then divide the new amount by the old one. When both pans are the same depth, this is the same as dividing the areas. This tool does it for you, and it also handles bundt pans and several pans at once.
        - heading "How to convert a recipe to a different pan size" [level=2] [ref=e166]
        - list [ref=e167]:
          - listitem [ref=e168]: Choose inches or centimeters.
          - listitem [ref=e169]: Under "Pan in the recipe," pick the shape and the size the recipe names.
          - listitem [ref=e170]: Under "Pan you will use," pick the pan you own.
          - listitem [ref=e171]: Read the scale factor. It updates as you type.
          - listitem [ref=e172]: Paste the ingredient list. Each line is scaled and rounded to amounts you can measure.
          - listitem [ref=e173]: Add the bake time and oven temperature for a guide to the new baking time.
        - 'heading "Worked example: 8 inch round to 9 inch round" [level=2] [ref=e174]'
        - paragraph [ref=e175]: An 8 inch round pan has an area of 50.3 square inches. A 9 inch round has 63.6 square inches. Divide 63.6 by 50.3 and you get 1.27. Every ingredient goes up by 27%.
        - list [ref=e176]:
          - listitem [ref=e177]: 1 1/2 cups flour becomes 1 7/8 cups.
          - listitem [ref=e178]: 1 cup sugar becomes 1 1/4 cups.
          - listitem [ref=e179]: 1/2 cup butter becomes 5/8 cup.
          - listitem [ref=e180]: 2 eggs becomes 2 1/2 eggs. Beat one extra egg and use half of it.
        - paragraph [ref=e181]: The batter depth stays the same, so the oven stays at 350°F. Check the cake a few minutes early, because a wider cake can finish sooner.
        - heading "Swap a round pan for a square or rectangular pan" [level=2] [ref=e182]
        - paragraph [ref=e183]: Shape does not change the method. A 9 inch square pan is 81 square inches, which is 27% more than a 9 inch round. An 8 inch square is 64 square inches, almost the same as a 9 inch round at 63.6, so those two swap with no change. Use the swap button to flip the two pans and see the reverse factor. Set the number of pans on each side when a recipe uses two layers and you want to bake one sheet cake.
        - heading "Common cake pan conversions" [level=2] [ref=e184]
        - paragraph [ref=e185]: These factors assume both pans are filled to the same depth. Use them as a quick check, or type your own sizes above.
