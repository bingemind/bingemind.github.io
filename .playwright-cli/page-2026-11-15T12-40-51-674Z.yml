        - paragraph [ref=e246]: A 9x13 pan is 117 square inches. A 9 inch square is 81. A 9x5 loaf pan is 45.
        - heading "Area or volume?" [level=2] [ref=e247]
        - paragraph [ref=e248]: Most charts compare area only. That works when both pans are the same depth, and most cake pans are about 2 inches deep. A deep pan holds more than its area suggests. This tool compares volume, so you can set the depth of each pan. It also compares bundt and tube pans by their capacity in cups. You can fill a bundt pan only to about 60% of its rated cups, so the tool counts the batter it bakes, not the water it holds. Sheet pans are only 1 inch deep, but the tool fills them to the same depth as a cake pan (2 inches) unless you change the depth. Lower the depth for a thinner sheet cake.
        - heading "Adjust the bake time and temperature" [level=2] [ref=e249]
        - paragraph [ref=e250]: Batter depth matters more than pan size for baking time. When the batter is deeper than in the recipe, the middle sets later than the edges. Lower the oven by about 25°F, bake longer and tent the top with foil if it browns too fast. When the batter is thinner, keep the temperature and start checking early. The tool gives a time range, but it is a guide. Ovens differ, and a toothpick that comes out clean is the real test.
        - heading "Tips for better results" [level=2] [ref=e251]
        - list [ref=e252]:
          - listitem [ref=e253]: Fill pans no more than two thirds full. Bake extra batter as cupcakes.
          - listitem [ref=e254]: Use the pan sizes printed on the pan or the box. Measure across the inside, from edge to edge.
          - listitem [ref=e255]: Weigh ingredients when you can. Grams scale more exactly than cups.
          - listitem [ref=e256]: Scale eggs last. Beat an egg and measure out half when you need half.
          - listitem [ref=e257]: For three layers from a two-layer recipe, set the number of pans to 3 on your side.
        - paragraph [ref=e258]: You will also see this tool called a cake tin converter outside the US. Use the centimeters button for metric tins. The oven has its own °F and °C buttons.
