    - region [ref=f32e171]:
      - article [ref=f32e172]:
        - heading "How to count a cash drawer (fast)" [level=2] [ref=f32e173]
        - paragraph [ref=f32e174]: The cash drawer counter on this page adds up the bills and coins in your register at the end of a shift. You type how many of each you have. The tool does the math, shows the total, and tells you how much to deposit. It also shows what to leave in the drawer and which bills and coins to take out.
        - heading "Count the drawer in six steps" [level=2] [ref=f32e175]
        - paragraph [ref=f32e176]:
          - text: Want the quickest method? Read the guide on the
          - link "fastest way to count a cash drawer" [ref=f32e177] [cursor=pointer]:
            - /url: /cash-drawer-counter/fastest-way-to-count-a-cash-drawer/
          - text: .
        - list [ref=f32e178]:
          - listitem [ref=f32e179]: Close the sale screen so no new sales come in while you count.
          - listitem [ref=f32e180]: Take all cash out of the drawer, including the bills under the tray.
          - listitem [ref=f32e181]: Sort it by type. Face all bills the same way and put the largest on top.
          - listitem [ref=f32e182]: Count each type once and enter the number in its row. Start with the $100 bills and work down to the pennies.
          - listitem [ref=f32e183]: Enter your starting float. The tool shows the cash to deposit, what to leave in the drawer, and what to take out.
          - listitem [ref=f32e184]: Enter the expected cash sales from your register report. The tool shows if you are over or short.
        - paragraph [ref=f32e185]: Press Enter after each row to jump to the next one. On a phone, the number keypad opens by itself. This is the same count that shops call a till count, a register balance or "cashing up".
        - heading "What is a float?" [level=2] [ref=f32e186]
        - paragraph [ref=f32e187]: A float is the cash you leave in the drawer so the next shift can make change. It is also called a bank, a till float, or a starting bank. Many shops use $100 to $300. The float is not sales money. You count it, then you leave it.
        - paragraph [ref=f32e188]: Your deposit is the total in the drawer minus the float. If you count $1,250.00 and the float is $200.00, you deposit $1,050.00.
        - heading "How the take-out list works" [level=2] [ref=f32e189]
        - paragraph [ref=f32e190]: "The tool picks the float first, so the next shift can make change. It aims for a mix: about 40% in $20 bills, then $10 bills, $5 bills and $1 bills, with a few quarters, dimes, nickels and pennies. If the drawer lacks one kind, it fills the gap with what you have, largest first. It never leaves $100 or $50 bills in the drawer. Everything else goes in the deposit. The tool shows a green check when the bills it leaves add up to exactly your float."
        - paragraph [ref=f32e191]: If the cash can make the float exactly, the tool finds a way to do it. If it cannot, the tool says how much is missing, so you can swap bills by hand. The deposit shown is always the value of the take-out list.
        - heading "Tips to avoid counting errors" [level=2] [ref=f32e192]
        - list [ref=f32e193]:
          - listitem [ref=f32e194]: Count twice if the drawer is off by more than a few dollars. Count a different way the second time, for example by stack size.
          - listitem [ref=f32e195]: Count coins in rolls or stacks of ten. Do not count them one by one.
          - listitem [ref=f32e196]: Check for stuck bills. Two bills can stick together, especially when new.
          - listitem [ref=f32e197]: Do not mix checks, gift cards or coupons with cash. Count them apart.
          - listitem [ref=f32e198]: Enter the expected sales from the same time you stopped sales. A late sale causes a false shortage.
          - listitem [ref=f32e199]: Have a second person watch or sign the count if your shop has a rule for it.
        - heading "Worked example" [level=2] [ref=f32e200]
        - paragraph [ref=f32e201]: "A cafe closes with this cash in the drawer: 2 $100 bills, 3 $50 bills, 20 $20 bills, 15 $10 bills, 30 $5 bills, 40 $1 bills, 20 quarters, 15 dimes, 10 nickels and 25 pennies."
        - list [ref=f32e202]:
          - listitem [ref=f32e203]: Bills add up to $1,090.00. Coins add up to $7.25. The total in the drawer is $1,097.25.
          - listitem [ref=f32e204]: The float is $200.00. The tool leaves 8 $20 bills, 1 $10 bill, 3 $5 bills, 10 $1 bills, 13 quarters, 11 dimes, 10 nickels and 15 pennies in the drawer.
          - listitem [ref=f32e205]: Cash to deposit is $897.25. You take out 2 $100 bills, 3 $50 bills, 12 $20 bills, 14 $10 bills, 27 $5 bills, 30 $1 bills, 7 quarters, 4 dimes and 10 pennies.
          - listitem [ref=f32e206]: Expected cash sales from the register report are $890.00. The drawer is over by $7.25.
        - heading "Common values at a glance" [level=2] [ref=f32e207]
        - table [ref=f32e208]:
          - rowgroup [ref=f32e209]:
            - row [ref=f32e210]:
              - columnheader "Item" [ref=f32e211]
              - columnheader "Value" [ref=f32e212]
          - rowgroup [ref=f32e213]:
            - row [ref=f32e214]:
              - cell "Roll of quarters (40 coins)" [ref=f32e215]
              - cell "$10.00" [ref=f32e216]
            - row [ref=f32e217]:
