              - cell "$2,000.00" [ref=f32e231]
        - heading "Over and short" [level=2] [ref=f32e232]
        - paragraph [ref=f32e233]:
          - text: "Over means you have more cash than the register says. Short means less. A small difference is common, often from wrong change. A large or repeated difference needs a check of voids, refunds, tips, and paid-outs. The tool works out the cash the drawer should hold: the float plus cash sales, minus any paid-outs. It compares that with your count. Use cash sales only, not card sales. There is a worked example on the"
          - link "over and short calculator" [ref=f32e234] [cursor=pointer]:
            - /url: /cash-drawer-counter/cash-drawer-over-short-calculator/
          - text: page.
        - heading "How to close out a register" [level=2] [ref=f32e235]
        - paragraph [ref=f32e236]:
          - text: "To close out a register, or cash out a till, stop sales and print the end-of-shift report. Take the till out and count it once with this calculator. Enter the cash sales from the report. Leave the float in the drawer, put the deposit in a bag with the count sheet, and sign it. A cash drop during the shift works the same way: count what you take out and write it down. The"
          - link "cash drop calculator" [ref=f32e237] [cursor=pointer]:
            - /url: /cash-drawer-counter/cash-drop-calculator/
          - text: page shows how.
        - heading "Who uses a drawer count" [level=2] [ref=f32e238]
        - paragraph [ref=f32e239]: Cashiers count at the end of every shift. Shift leads count when one cashier hands the drawer to the next. Owners of small shops and food trucks count to match the cash against the sales report before the bank run. The steps are the same for each of them, so one calculator fits all three.
        - heading "Cash register count sheet" [level=2] [ref=f32e240]
        - paragraph [ref=f32e241]:
          - text: Some shops want a paper count sheet. There is a free
          - link "cash register count sheet" [ref=f32e242] [cursor=pointer]:
            - /url: /cash-drawer-counter/cash-register-count-sheet/
          - text: that you can print blank. It has opening and closing columns, an over and short section, and lines for the cashier and the checker to sign. It fits on one Letter page. You can also fill in this calculator and print the filled sheet, with the cashier name and register number if you add them under Sheet details.
        - heading "Half dollars" [level=2] [ref=f32e243]
        - paragraph [ref=f32e244]: Half dollars are under More coins, below the rolls. Most drawers have none, so the row stays closed until you open it.
        - heading "Private and fast" [level=2] [ref=f32e245]
        - paragraph [ref=f32e246]: Everything runs in your browser. Your counts are not sent anywhere. The tool saves your last float and your counts on your own device, so you do not need to type the float every night and a refresh does not lose a count. Use the Print button for a clean sheet, or Copy summary to paste it into an email or a text.
