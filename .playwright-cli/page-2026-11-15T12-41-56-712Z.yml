              - cell "$5.00" [ref=f32e219]
            - row [ref=f32e220]:
              - cell "Roll of nickels (40 coins)" [ref=f32e221]
              - cell "$2.00" [ref=f32e222]
            - row [ref=f32e223]:
              - cell "Roll of pennies (50 coins)" [ref=f32e224]
              - cell "$0.50" [ref=f32e225]
            - row [ref=f32e226]:
              - cell "Strap of 100 $1 bills" [ref=f32e227]
              - cell "$100.00" [ref=f32e228]
            - row [ref=f32e229]:
