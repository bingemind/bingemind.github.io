              - list [ref=e97]:
                - listitem [ref=e98]: Weekly = $20 × 40 hours = $800
                - listitem [ref=e99]: Annual = $800 × 52 weeks = $41,600
                - listitem [ref=e100]: Monthly = $41,600 ÷ 12 = $3,466.67
                - listitem [ref=e101]: Twice a month = $41,600 ÷ 24 = $1,733.33
                - listitem [ref=e102]: Every two weeks = $800 × 2 = $1,600
                - listitem [ref=e103]: Daily = $800 ÷ 5 days = $160
    - region [ref=e104]:
      - article [ref=e105]:
        - heading "What does an hourly to salary calculator do?" [level=2] [ref=e106]
        - paragraph [ref=e107]: An hourly to salary calculator turns an hourly rate into the pay you get for a day, a week, a month and a year. It helps you compare an hourly job with a salaried job, plan a budget, or check a freelance quote. This calculator uses your real hours and the weeks you actually work, and it shows the math.
        - heading "How to use the hourly to salary calculator" [level=2] [ref=e108]
        - list [ref=e109]:
          - listitem [ref=e110]: Type your hourly rate in dollars.
          - listitem [ref=e111]: Type the hours you work in a normal week.
          - listitem [ref=e112]: Pick the weeks you work in a year. Use 50 or 48 if you take 2 or 4 unpaid weeks off.
          - listitem [ref=e113]: Read your pay for each period. Change any number and the results change at once.
          - listitem [ref=e114]: To go the other way, switch to Salary to hourly and type a yearly salary.
          - listitem [ref=e115]: Press Copy summary to paste the numbers into a message or a note.
        - heading "The formula" [level=2] [ref=e116]
        - paragraph [ref=e117]: Yearly pay is your hourly rate times the hours you work each week, times the weeks you work each year.
        - paragraph [ref=e118]:
          - strong [ref=e119]: Yearly pay = hourly rate × hours per week × weeks per year
        - paragraph [ref=e120]: A full-time year is often counted as 40 hours a week for 52 weeks, which is 2,080 hours. At $20 an hour, that is $20 × 2,080 = $41,600 a year.
        - heading "$20 an hour is how much a year?" [level=2] [ref=e121]
        - region "$20 an hour at different hours" [ref=e122]:
