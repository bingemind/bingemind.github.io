                - cell "$4,333.33" [ref=e165]
                - cell "$52,000" [ref=e166]
                - cell [ref=e167]:
                  - button "Use $20 an hour, 50 hours a week" [ref=e168] [cursor=pointer]: Use
        - paragraph [ref=e169]: With 2 unpaid weeks off (50 weeks), 40 hours a week at $20 is $40,000 a year. With 4 weeks off (48 weeks), it is $38,400.
        - heading "Why monthly pay is not weekly pay times 4" [level=2] [ref=e170]
        - paragraph [ref=e171]: A year has 52 weeks but only 12 months, so an average month has about 4.33 weeks. If you multiply weekly pay by 4, you miss about one month of pay each year. That is why this calculator divides yearly pay by 12. At $800 a week, monthly pay is $41,600 ÷ 12 = $3,466.67, not $3,200.
        - heading "Every two weeks or twice a month?" [level=2] [ref=e172]
        - paragraph [ref=e173]: These sound alike but are different.
        - list [ref=e174]:
          - listitem [ref=e175]:
            - strong [ref=e176]: Every two weeks
            - text: (biweekly) means 26 paydays a year. Each one is two weeks of pay.
          - listitem [ref=e177]:
            - strong [ref=e178]: Twice a month
            - text: (semimonthly) means 24 paydays a year, often on the 15th and the last day of the month. Each one is yearly pay divided by 24.
        - paragraph [ref=e179]: At $41,600 a year, every two weeks is $1,600 and twice a month is $1,733.33.
        - heading "Common hourly rates as yearly pay" [level=2] [ref=e180]
