        - heading "Unpaid time off and freelance work" [level=2] [ref=e235]
        - paragraph [ref=e236]: If you are paid only for the hours you work, weeks off cut your yearly pay. Freelancers and contractors often take 2 to 4 unpaid weeks a year for holidays, sick days and gaps between projects. Use the 50 or 48 week buttons to see the effect. At $20 an hour and 40 hours a week, 2 unpaid weeks lower yearly pay from $41,600 to $40,000.
        - paragraph [ref=e237]: If you have paid vacation, keep 52 weeks, because you are paid for those weeks.
        - heading "Before tax" [level=2] [ref=e238]
        - paragraph [ref=e239]: Every number on this page is gross pay, before tax and before any deductions. Your take-home pay will be lower. This calculator does not estimate tax.
