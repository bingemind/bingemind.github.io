    - region [ref=e88]:
      - article [ref=e89]:
        - heading "What a JSON diff checker does" [level=2] [ref=e90]
        - paragraph [ref=e91]:
          - text: You can run a free JSON diff online here. Paste two documents and read the result on the page. A JSON diff checker compares two JSON documents and lists what changed. This one shows each change with its path, for example
          - code [ref=e92]: $.user.email
          - text: ", the old value and the new value. It compares the data and ignores the layout. As a JSON diff viewer, it keeps the list short, so you can read it without scrolling through both files."
        - paragraph [ref=e93]:
          - text: Prefer code? See how to do a
          - link "JSON diff in Python" [ref=e94] [cursor=pointer]:
            - /url: /json-diff/json-diff-python/
          - text: with the standard library, and when an online JSON diff tool is the faster choice.
        - paragraph [ref=e95]: A plain text diff does not work well for JSON. Two files can hold the same data with the keys in another order, or one file can sit on a single line. A text diff then marks every line as changed. Here, only real changes show up.
        - 'heading "Exact numbers: JSON compare that does not round" [level=2] [ref=e96]'
        - paragraph [ref=e97]:
          - text: Many online JSON compare tools read every number as a floating point value. A number with 17 or more digits then loses its last digits. Two different ids can look the same. In our test on October 21, 2026, three of four popular tools called the two numbers below identical, and one of them rewrote both as
          - code [ref=e98]: "12345678901234567000"
          - text: .
        - generic [ref=e99]:
          - table [ref=e100]:
            - rowgroup [ref=e101]:
              - row [ref=e102]:
                - columnheader "Document" [ref=e103]
                - columnheader "Value" [ref=e104]
            - rowgroup [ref=e105]:
              - row [ref=e106]:
                - cell "Original" [ref=e107]
                - cell [ref=e108]:
                  - code [ref=e109]: "12345678901234567890"
              - row [ref=e110]:
                - cell "Changed" [ref=e111]
                - cell [ref=e112]:
                  - code [ref=e113]: "12345678901234567891"
              - row [ref=e114]:
                - cell "This tool" [ref=e115]
                - cell "1 change. Numbers keep every digit." [ref=e116]
          - button "Try the 20-digit example" [ref=e117] [cursor=pointer]
        - paragraph [ref=e118]:
          - text: Numbers still compare by value, so
          - code [ref=e119]: "1.0"
          - text: ","
          - code [ref=e120]: "1"
          - text: and
          - code [ref=e121]: "1e0"
          - text: are equal. The example also holds
          - code [ref=e122]: "10.5"
          - text: and
          - code [ref=e123]: "10.50"
          - text: . They match.
        - heading "How to compare two JSON files" [level=2] [ref=e124]
        - list [ref=e125]:
          - listitem [ref=e126]:
            - text: Paste the first JSON into
            - strong [ref=e127]: Original
            - text: and the second into
            - strong [ref=e128]: Changed
            - text: . You can also drop a file on a box or press
            - strong [ref=e129]: Open
            - text: .
          - listitem [ref=e130]: Read the list of changes. Each row shows the kind of change, the path, and the values. The list updates while you type.
          - listitem [ref=e131]: "Set options if you need them: how to match arrays, which fields to ignore, and the rules for numbers and text. Options that are on show as chips under the toolbar."
        - paragraph [ref=e132]:
          - text: Press Ctrl or Cmd and Enter to compare at once. The
          - strong [ref=e133]: Sample
          - text: button loads a pair that shows every kind of change. Use
          - strong [ref=e134]: Copy share link
          - text: to send a diff to a colleague. The link holds both documents, so share it only with people who may see them.
        - heading "What it ignores and what it reports" [level=2] [ref=e135]
        - table [ref=e136]:
          - rowgroup [ref=e137]:
            - row [ref=e138]:
              - columnheader "Case" [ref=e139]
              - columnheader "Result" [ref=e140]
          - rowgroup [ref=e141]:
            - row [ref=e142]:
              - cell [ref=e143]:
                - code [ref=e144]: "{\"a\":1,\"b\":2}"
                - text: and
                - code [ref=e145]: "{\"b\":2,\"a\":1}"
              - cell "Equal. Key order is ignored." [ref=e146]
            - row [ref=e147]:
              - cell "Pretty printed and minified text" [ref=e148]
              - cell "Equal. Spaces and line breaks are ignored." [ref=e149]
            - row [ref=e150]:
              - cell [ref=e151]:
                - code [ref=e152]: "1.0"
                - text: and
                - code [ref=e153]: "1"
                - text: ", or"
                - code [ref=e154]: "1e3"
                - text: and
                - code [ref=e155]: "1000"
              - cell "Equal. Numbers compare by value." [ref=e156]
            - row [ref=e157]:
              - cell [ref=e158]:
                - code [ref=e159]: "1"
                - text: and
                - code [ref=e160]: "\"1\""
              - 'cell "Type change: number to string." [ref=e161]'
            - row [ref=e162]:
              - cell [ref=e163]:
                - code [ref=e164]: "null"
                - text: and a missing key
              - cell "Different. The key is added or removed." [ref=e165]
            - row [ref=e166]:
              - cell [ref=e167]:
                - code [ref=e168]: "12345678901234567890"
                - text: and
                - code [ref=e169]: "12345678901234567891"
              - cell "Different. Big numbers are not rounded." [ref=e170]
        - heading "Compare JSON arrays by id" [level=2] [ref=e171]
        - paragraph [ref=e172]: Arrays are the hard part of a JSON compare. Take two lists of three records with the ids 1, 2 and 3. In the second list the records come in another order, and record 1 has a new value. Compared by position, item 1 meets item 1, item 2 meets item 2, and so on. Every item sits in a different place, so the tool reports 6 changes.
        - paragraph [ref=e173]:
          - text: Compared by key
          - code [ref=e174]: id
          - text: ", each record meets the record with the same id. The tool reports one change:"
          - code [ref=e175]: $.u[id=1].v
          - text: . This is the usual choice when you compare API responses. In
          - strong [ref=e176]: Side by side
          - text: ", matched records sit on the same row, and a moved record carries a ⇅ mark."
        - paragraph [ref=e177]:
          - text: The default,
          - strong [ref=e178]: Auto
          - text: ", looks for a field that every item has and that never repeats. It tries"
          - code [ref=e179]: id
          - text: ","
          - code [ref=e180]: uuid
          - text: ","
          - code [ref=e181]: _id
          - text: ","
          - code [ref=e182]: key
          - text: ","
          - code [ref=e183]: sku
          - text: ","
          - code [ref=e184]: code
          - text: ","
          - code [ref=e185]: slug
          - text: ","
          - code [ref=e186]: email
          - text: and
          - code [ref=e187]: name
          - text: ", in this order. It tells you what it chose above the result, and each array has its own choice. If the ids repeat, Auto falls back to position and shows a warning."
        - paragraph [ref=e188]:
          - button "Load the match by id example" [ref=e189] [cursor=pointer]
        - heading "Ignore array order in a JSON compare" [level=2] [ref=e190]
        - paragraph [ref=e191]:
          - text: Sometimes the order of items does not matter. A list of members or tags can come back in any order. Set
          - strong [ref=e192]: Arrays
          - text: to
          - strong [ref=e193]: Ignore order
          - text: . The tool matches items that are equal, wherever they sit, at every depth. It then pairs the items that are left by the number of fields they share, so a changed item shows as changed and not as removed plus added.
        - paragraph [ref=e194]:
          - text: You can also choose it for one array only, for example
          - code [ref=e195]: roles
          - text: ", and keep Auto for the rest. When a position match finds the same items in another order, the result suggests Ignore order."
        - paragraph [ref=e196]:
          - button "Load the ignore order example" [ref=e197] [cursor=pointer]
        - heading "Ignore fields such as timestamps" [level=2] [ref=e198]
        - paragraph [ref=e199]:
          - text: Fields like
          - code [ref=e200]: updatedAt
          - text: or
          - code [ref=e201]: requestId
          - text: change on every call. Add them under
          - strong [ref=e202]: Options
          - text: ","
          - strong [ref=e203]: Ignore paths
          - text: ", one pattern per line:"
        - list [ref=e204]:
          - listitem [ref=e205]:
            - code [ref=e206]: "**.updatedAt"
            - text: skips that field at any depth.
          - listitem [ref=e207]:
            - code [ref=e208]: items[*].id
            - text: skips the id of every item in
            - code [ref=e209]: items
            - text: .
          - listitem [ref=e210]:
            - code [ref=e211]: $.meta.requestId
            - text: skips one exact place.
        - paragraph [ref=e212]: A pattern with an error shows the line number. The result tells you how many places were ignored.
        - paragraph [ref=e213]:
          - button "Load the ignore fields example" [ref=e214] [cursor=pointer]
        - heading "Compare large JSON files" [level=2] [ref=e215]
        - paragraph [ref=e216]: The compare runs in a background worker, so you can keep typing while it works. A Cancel button appears when a compare takes more than a moment. In our tests, two files of about 5 MB with 35,000 records each compared in under two seconds on a laptop. The result shows the time it took. Files up to 50 MB open, and the tool warns you above 25 MB. Very large files depend on your device and browser.
        - paragraph [ref=e217]:
          - button "Compare two 5 MB files" [ref=e218] [cursor=pointer]
        - heading "Your data stays in your browser" [level=2] [ref=e219]
        - paragraph [ref=e220]: The comparison runs on your device. The page does not send what you paste to a server. You can check this yourself. Open the Network tab in your browser tools, paste two documents and press Compare. No request carries your data.
        - paragraph [ref=e221]: This site may count visits. That count never includes your JSON. Options you choose are saved in your browser only, so the next visit starts with the same settings. Your documents are not saved.
        - heading "What this tool does not do" [level=2] [ref=e222]
        - paragraph [ref=e223]:
          - text: This tool compares JSON. It does not convert to CSV or YAML, check a schema, or fetch a URL. Paste the text or open a file. It also does not merge changes. For other free tools, see
          - link "all Bingemind tools" [ref=e224] [cursor=pointer]:
            - /url: https://bingemind.com/tools/
          - text: .
