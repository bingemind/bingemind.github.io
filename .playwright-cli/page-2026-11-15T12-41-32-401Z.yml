    - article [ref=f26e234]:
      - generic [ref=f26e235]:
        - heading "How to make printable banner letters" [level=2] [ref=f26e236]
        - paragraph [ref=f26e237]: This tool turns a short message into printable banner letters. Each page holds one big letter, number or symbol. You print the pages, cut them out and hang them on string. It suits a birthday, a welcome home, a baby shower, a class door or a store sign.
        - list [ref=f26e238]:
          - listitem [ref=f26e239]: Type your message in the box at the top. The preview shows each page as you type.
          - listitem [ref=f26e240]: Pick Letter or A4 paper, and portrait or landscape.
          - listitem [ref=f26e241]: Choose a shape. A pennant is a triangle with a point at the bottom. A rectangle gives the largest letter.
          - listitem [ref=f26e242]: Choose Outline to save ink or let children color the letters. Choose Filled for solid letters.
          - listitem [ref=f26e243]: Pick a font and a color, or Rainbow for a different color on each page.
          - listitem [ref=f26e244]: Press Download PDF. Print at 100% or Actual size, cut along the dashed line and punch the holes.
        - heading "Pennant or rectangle" [level=2] [ref=f26e245]
        - paragraph [ref=f26e246]: A pennant banner is the classic party flag. The letter sits in the wide top part of a downward triangle, so it is smaller than the page. A rectangle uses the whole page, so the letter is as large as it can be. Pick None if you want the letter alone, for example to cut it out and glue it on a card.
        - heading "How big are the letters?" [level=2] [ref=f26e247]
        - paragraph [ref=f26e248]: Every letter in the banner has the same height. The tool finds the largest size that fits the widest letter, such as W or M, and uses it on every page. On a portrait page the height of the letter is limited by the page, and wide letters shrink the whole row a little. A landscape page gives a shorter and wider letter.
        - table [ref=f26e249]:
          - caption [ref=f26e250]: Pages needed for common messages
          - rowgroup [ref=f26e251]:
            - row [ref=f26e252]:
              - columnheader "Message" [ref=f26e253]
