        - heading "Tips for a good banner" [level=2] [ref=f26e277]
        - list [ref=f26e278]:
          - listitem [ref=f26e279]: Print on cardstock. It hangs flat and does not curl.
          - listitem [ref=f26e280]: Print one test page first and check that the border is not cut off.
          - listitem [ref=f26e281]: Use string or ribbon about as long as the banner plus 2 feet for the knots.
          - listitem [ref=f26e282]: Use tape or a hole punch. The punch marks show where the holes go.
          - listitem [ref=f26e283]: Turn on page numbers if you print several words, so you can put the pages back in order.
