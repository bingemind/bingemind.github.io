        - heading "Convert a column to CSV" [level=2] [ref=f14e182]
        - paragraph [ref=f14e183]:
          - text: This tool also works as a column to CSV converter. It gives you one row of values with a comma between them. Use the Plain list or CSV row settings above. Pick Double quotes if a value can hold a comma. To convert a column to a CSV file, press Download .txt and rename it to .csv. There is a separate page for
          - link "column to CSV online" [ref=f14e184] [cursor=pointer]:
            - /url: /column-to-comma/column-to-csv-online/
          - text: .
        - heading "Column to comma in Excel and Google Sheets" [level=2] [ref=f14e185]
        - paragraph [ref=f14e186]:
          - text: Both programs have a built-in way to join cells. In Excel and Sheets,
          - code [ref=f14e187]: =TEXTJOIN(",", TRUE, A1:A100)
          - text: joins the range with commas and skips empty cells. It works well for a fixed range, but it cannot add quotes, drop duplicates or sort without extra formulas. This tool does all of that in one step, and you do not need to change your file.
        - paragraph [ref=f14e188]: The tool also accepts text copied from a database client, a CSV file, an email or a web page. It handles Windows, Mac and Linux line breaks.
        - heading "What each option does" [level=2] [ref=f14e189]
        - list [ref=f14e190]:
          - listitem [ref=f14e191]:
            - strong [ref=f14e192]: Trim spaces
            - text: removes spaces and tabs around each value. Cells copied from a sheet often carry them.
          - listitem [ref=f14e193]:
            - strong [ref=f14e194]: Remove blank lines
            - text: drops empty rows, so you never get
            - code [ref=f14e195]: a,,b
            - text: .
          - listitem [ref=f14e196]:
            - strong [ref=f14e197]: Remove duplicates
            - text: keeps the first copy of each value. Tick
            - strong [ref=f14e198]: Ignore case for duplicates
            - text: to treat Ab and ab as the same.
          - listitem [ref=f14e199]:
            - strong [ref=f14e200]: Sort
            - text: orders values from A to Z or Z to A. Numbers inside text sort the natural way, so item2 comes before item10. The number options sort by value.
          - listitem [ref=f14e201]:
            - strong [ref=f14e202]: Letter case
            - text: changes values to upper case, lower case or Title Case before duplicates are checked.
          - listitem [ref=f14e203]:
            - strong [ref=f14e204]: Before and after each item
            - text: adds text around every value, such as
            - code [ref=f14e205]: <li>
            - text: and
            - code [ref=f14e206]: </li>
            - text: . The same pair of fields for the whole list adds text at the start and end.
          - listitem [ref=f14e207]:
            - strong [ref=f14e208]: Use only the first column
            - text: keeps the first column when you copy several columns from Excel.
          - listitem [ref=f14e209]:
            - strong [ref=f14e210]: Do not quote numbers
            - text: leaves 42 and 3.5 bare but quotes 007, so leading zeros survive.
        - heading "Tips for clean results" [level=2] [ref=f14e211]
        - paragraph [ref=f14e212]: If your values contain commas, such as "Smith, John", turn on double quotes so the next program reads each name as one value. Check the count under the output. It shows how many lines went in and how many items came out, so you can see that nothing was lost.
        - heading "Convert a list back to a column" [level=2] [ref=f14e213]
        - paragraph [ref=f14e214]:
          - text: Switch to
          - strong [ref=f14e215]: List to column
          - text: to go the other way. Paste
          - code [ref=f14e216]: "'a', 'b', 'c'"
          - text: and you get three rows. The tool removes the quotes and brackets, and it keeps a comma that sits inside a quoted value. Leave
          - strong [ref=f14e217]: Split on
          - text: at Auto-detect to split on commas, semicolons, pipes or tabs.
        - heading "When a comma separated list helps" [level=2] [ref=f14e218]
        - list [ref=f14e219]:
          - listitem [ref=f14e220]:
            - strong [ref=f14e221]: Database queries.
            - text: Fill an IN clause with IDs from a report instead of typing them one by one.
          - listitem [ref=f14e222]:
            - strong [ref=f14e223]: Email and marketing tools.
            - text: Many forms ask for tags, addresses or keywords in one comma separated field.
          - listitem [ref=f14e224]:
            - strong [ref=f14e225]: Code.
            - text: Turn a column of names into an array for Python, JavaScript or JSON.
          - listitem [ref=f14e226]:
            - strong [ref=f14e227]: Search and filters.
            - text: Tools that filter by a list of SKUs or order numbers usually want one line.
          - listitem [ref=f14e228]:
            - strong [ref=f14e229]: Spreadsheet formulas.
            - text: Paste a list of values into a function that expects them inline.
        - paragraph [ref=f14e230]:
          - text: "If a tool rejects your list, check three things: stray spaces, a trailing comma, and quotes of the wrong kind."
          - strong [ref=f14e231]: Trim spaces
          - text: and
          - strong [ref=f14e232]: Remove blank lines
          - text: are on by default, which fixes the first two. The Quotes menu fixes the third.
        - heading "Large lists and privacy" [level=2] [ref=f14e233]
        - paragraph [ref=f14e234]: The tool works on lists of 100,000 rows in well under a second. Everything runs in your browser, and your text is never uploaded.
