    - region [ref=f14e112]:
      - article [ref=f14e113]:
        - heading "How to convert a column to a comma separated list" [level=2] [ref=f14e114]
        - paragraph [ref=f14e115]: You have a column of values in Excel, Google Sheets or a SQL result. You need them in one line, with commas between them. This page does that. Paste the column into the left box and the list appears on the right. There is no button to press and nothing to install.
        - list [ref=f14e116]:
          - listitem [ref=f14e117]: Copy the cells. Select the column in your sheet and press Ctrl+C (Cmd+C on a Mac).
          - listitem [ref=f14e118]:
            - text: Click the left box and paste. You can also tap
            - strong [ref=f14e119]: Paste
            - text: .
          - listitem [ref=f14e120]: Pick a separator and, if you need them, quotes.
          - listitem [ref=f14e121]:
            - text: Press
            - strong [ref=f14e122]: Copy
            - text: ", or hit Ctrl+Enter (Cmd+Enter on a Mac), and paste the list where you need it."
        - 'heading "Worked example: build a SQL IN list" [level=2] [ref=f14e123]'
        - paragraph [ref=f14e124]: "Say you have four customer IDs in a sheet and you want to look them up in a database. Paste these four rows:"
        - code [ref=f14e126]: 1001 1002 1002 1004
        - paragraph [ref=f14e127]:
          - text: Click
          - strong [ref=f14e128]: SQL IN list
          - text: ", then tick"
          - strong [ref=f14e129]: Remove duplicates
          - text: ". You get this:"
        - code [ref=f14e131]: (1001, 1002, 1004)
        - paragraph [ref=f14e132]:
          - text: Paste it after
          - code [ref=f14e133]: WHERE id IN
          - text: and run the query. For text values such as names or codes, the quotes stay on, so you get
          - code [ref=f14e134]: ('AB-1', 'AB-2')
          - text: . A name like O'Brien becomes
          - code [ref=f14e135]: "'O''Brien'"
          - text: ", which is the correct way to escape it in SQL."
        - paragraph [ref=f14e136]: "One warning: Oracle allows at most 1,000 items inside one IN list. If your list is longer, split it into several lists."
        - heading "Common settings" [level=2] [ref=f14e137]
        - table [ref=f14e138]:
