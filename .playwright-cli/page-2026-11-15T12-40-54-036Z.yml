    - region [ref=e56]:
      - article [ref=e57]:
        - heading "How to change image DPI to 300" [level=2] [ref=e58]
        - paragraph [ref=e59]: To change image DPI to 300, drop your JPEG or PNG on the tool above, pick 300, and download the file. The tool only edits the small header of the file that stores the DPI value. It does not resize, re-compress or re-save the picture. The pixels stay the same, so the quality stays the same.
        - list [ref=e60]:
          - listitem [ref=e61]: Add one or more JPEG, PNG or WebP files, or paste an image.
          - listitem [ref=e62]: Choose 72, 96, 150, 300 or 600, or type your own value.
          - listitem [ref=e63]: Check the print size shown for each file.
          - listitem [ref=e64]: Download each file, or all of them as one zip.
        - heading "Convert 72 DPI to 300 DPI" [level=2] [ref=e65]
        - paragraph [ref=e66]: Most exports from design apps and screenshots say 72 DPI. To convert 72 DPI to 300 DPI, add the file, keep 300 selected, and download it. The picture does not change. Only the label changes, so the print size gets smaller. A 2400 by 3000 pixel file prints at 33.3 by 41.7 inches at 72 DPI, and at 8 by 10 inches at 300 DPI. If you need a larger print at 300 DPI, you need more pixels.
        - heading "What DPI means" [level=2] [ref=e67]
        - paragraph [ref=e68]: DPI stands for dots per inch. It tells a printer how many pixels of the image to place in one inch of paper. A 3000 by 2000 pixel photo at 300 DPI prints at 10 by 6.7 inches. The same photo at 150 DPI prints at 20 by 13.3 inches. The pixels did not change. Only the printed size did.
        - heading "Why print shops ask for 300 DPI" [level=2] [ref=e69]
        - paragraph [ref=e70]: At 300 DPI, the dots are so small that the eye sees smooth lines and sharp text. Below about 150 DPI, edges start to look soft or blocky. Print shops, photo labs and print-on-demand sites such as Etsy printables and book printers use 300 DPI as a safe standard. Large posters viewed from far away can use less.
        - heading "DPI is not the same as pixels" [level=2] [ref=e71]
        - paragraph [ref=e72]: Pixels are the real detail in a picture. DPI is only a label that says how big to print those pixels. A file can say 72 DPI or 300 DPI and hold exactly the same picture. Screens ignore the DPI value. Print software and layout programs read it to set the size on the page.
        - paragraph [ref=e73]: This is why a file that says 72 DPI is often rejected by a print service. The label is wrong for print, even if the picture is fine. Changing the label fixes that without any loss.
        - heading "When changing DPI is not enough" [level=2] [ref=e74]
        - paragraph [ref=e75]: Changing the DPI label does not add detail. If you need an 8 by 10 inch print at 300 DPI, the image must be at least 2400 by 3000 pixels. A small web image of 800 by 600 pixels will become 2.7 by 2 inches at 300 DPI. If you force it to print larger, it will look soft.
        - paragraph [ref=e76]: "Do the math before you print: pixels divided by DPI gives inches. The tool shows this for you in inches and centimeters. If the print size is too small, you need a larger original. Upscaling programs can add pixels, but they guess the new detail and can change the look of the image."
        - heading "DPI and PPI" [level=2] [ref=e77]
        - paragraph [ref=e78]: You may also see PPI, which means pixels per inch. For image files the two terms mean the same thing in daily use. Photo apps say PPI. Print shops say DPI. Printers also use the word DPI for ink dots, which is a different number. For your image file, the value in the header is the one that counts.
        - heading "How to check the DPI of an image" [level=2] [ref=e79]
        - paragraph [ref=e80]: Add the file to the tool. The row shows the DPI it has now, the pixel size and the print size. You can also check on your computer. On a Mac, open the file in Preview and choose Tools, then Show Inspector. On Windows, right-click the file, choose Properties, then open the Details tab. Some files have no DPI value. The tool then shows "not set".
        - heading "Common uses" [level=2] [ref=e81]
        - list [ref=e82]:
          - listitem [ref=e83]: Etsy and print-on-demand listings that ask for 300 DPI files.
          - listitem [ref=e84]: School and work forms that need a scan at a set DPI.
          - listitem [ref=e85]: Photo prints, flyers, business cards and book covers.
          - listitem [ref=e86]: Fixing a batch of images that all say 72 DPI.
        - 'heading "Worked example: an Etsy printable" [level=2] [ref=e87]'
        - paragraph [ref=e88]: You made a poster at 2400 by 3000 pixels. Your export says 72 DPI, and the shop wants 300 DPI. Drop the file in, pick 300, and download. The tool shows 8 by 10 inches (20.3 by 25.4 cm). That fits an 8 by 10 frame, and the file now passes the shop check. If the buyer wants 16 by 20 inches, the same file would only give 150 DPI at that size, so you need a larger original.
        - heading "Common DPI values and print sizes" [level=2] [ref=e89]
